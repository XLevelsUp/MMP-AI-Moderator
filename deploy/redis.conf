# Redis for the moderation queue. Waiting jobs must survive a restart, so both snapshots and
# the append-only log are on. The password comes from REDIS_PASSWORD (--requirepass in compose).
bind 0.0.0.0
protected-mode yes
port 6379

appendonly yes
appendfsync everysec
save 900 1
save 300 10
dir /data

# The queue and the 30-day answer cache are small; never evict queue entries.
maxmemory 512mb
maxmemory-policy noeviction
